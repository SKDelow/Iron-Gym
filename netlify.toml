[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Keep old links functional after retiring the Program Finder.
[[redirects]]
  from = "/programs.html"
  to = "/visit.html"
  status = 301
  force = true